name: SAM Lambda Deploy

run-name: SAM Lambda - ${{ inputs.action }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Lambda action
        required: true
        type: choice
        options:
          - validate
          - deploy
          - destroy

permissions:
  contents: read

concurrency:
  group: oficina360-lambda
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK_NAME: oficina360-auth
  SAM_CLI_TELEMETRY: "0"

jobs:
  lambda:
    name: Lambda ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        if: inputs.action != 'destroy'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Validar Secrets AWS
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        env:
          ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          : "${ACCESS_KEY:?AWS_ACCESS_KEY_ID nao disponivel}"
          : "${SECRET_KEY:?AWS_SECRET_ACCESS_KEY nao disponivel}"
          : "${SESSION_TOKEN:?AWS_SESSION_TOKEN nao disponivel}"
          echo "Secrets AWS disponiveis."

      - name: Configurar credenciais AWS
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar identidade AWS
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        env:
          CONFIGURED_BUCKET: ${{ vars.SAM_ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          : "${ACCOUNT_ID:?Conta AWS nao identificada}"

          if [[ -n "$CONFIGURED_BUCKET" ]]; then
            SAM_ARTIFACTS_BUCKET="$CONFIGURED_BUCKET"
          else
            SAM_ARTIFACTS_BUCKET="oficina360-sam-${ACCOUNT_ID}-${AWS_REGION}"
          fi

          SAM_ARTIFACTS_PREFIX="sam/${STACK_NAME}"

          echo "AWS_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "SAM_ARTIFACTS_BUCKET=$SAM_ARTIFACTS_BUCKET" >> "$GITHUB_ENV"
          echo "SAM_ARTIFACTS_PREFIX=$SAM_ARTIFACTS_PREFIX" >> "$GITHUB_ENV"

          echo "Conta AWS: $ACCOUNT_ID"
          echo "Bucket SAM: $SAM_ARTIFACTS_BUCKET"
          echo "Prefixo SAM: $SAM_ARTIFACTS_PREFIX"

      - name: Validar template SAM
        if: inputs.action != 'destroy'
        run: |
          set -euo pipefail
          sam validate --lint --template-file template.yaml

      - name: Executar testes Maven
        if: inputs.action != 'destroy'
        run: |
          set -euo pipefail
          mvn --batch-mode test

      - name: Build Lambda
        if: inputs.action != 'destroy'
        run: |
          set -euo pipefail
          rm -rf .aws-sam
          sam build --template-file template.yaml
          test -s .aws-sam/build/template.yaml

      - name: Preparar bucket de artefatos SAM
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail
          : "${SAM_ARTIFACTS_BUCKET:?Bucket SAM nao calculado}"
          : "${SAM_ARTIFACTS_PREFIX:?Prefixo SAM nao calculado}"

          aws s3api head-bucket --bucket "$SAM_ARTIFACTS_BUCKET"

          TEST_FILE="$(mktemp)"
          trap 'rm -f "$TEST_FILE"' EXIT
          printf '%s\n' 'sam-access-test' > "$TEST_FILE"
          TEST_KEY="${SAM_ARTIFACTS_PREFIX}/access-test-${GITHUB_RUN_ID}.txt"

          aws s3api put-object \
            --bucket "$SAM_ARTIFACTS_BUCKET" \
            --key "$TEST_KEY" \
            --body "$TEST_FILE" >/dev/null

          aws s3api delete-object \
            --bucket "$SAM_ARTIFACTS_BUCKET" \
            --key "$TEST_KEY" >/dev/null

          echo "Bucket SAM validado com escrita e exclusao."

      - name: Resolver credenciais do banco
        if: inputs.action == 'deploy'
        env:
          RDS_SECRET_ARN: ${{ vars.RDS_SECRET_ARN }}
          FALLBACK_DB_USERNAME: ${{ secrets.DB_USERNAME }}
          FALLBACK_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "$RDS_SECRET_ARN" ]]; then
            SECRET_JSON="$(
              aws secretsmanager get-secret-value \
                --secret-id "$RDS_SECRET_ARN" \
                --query SecretString \
                --output text
            )"

            DB_USERNAME="$(jq -r '.username // empty' <<< "$SECRET_JSON")"
            DB_PASSWORD="$(jq -r '.password // empty' <<< "$SECRET_JSON")"
          else
            DB_USERNAME="$FALLBACK_DB_USERNAME"
            DB_PASSWORD="$FALLBACK_DB_PASSWORD"
          fi

          : "${DB_USERNAME:?Usuario do banco nao resolvido}"
          : "${DB_PASSWORD:?Senha do banco nao resolvida}"

          echo "::add-mask::$DB_USERNAME"
          echo "::add-mask::$DB_PASSWORD"
          echo "DB_USERNAME=$DB_USERNAME" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "Credenciais do banco resolvidas."

      - name: Validar configuracao do deploy
        if: inputs.action == 'deploy'
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          LAMBDA_SECURITY_GROUP_ID: ${{ vars.LAMBDA_SECURITY_GROUP_ID }}
          LAMBDA_SUBNET_IDS: ${{ vars.LAMBDA_SUBNET_IDS }}
          JWT_ISSUER: ${{ vars.JWT_ISSUER || 'oficina360-auth' }}
          JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION || '3600' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail

          : "${DATABASE_URL:?Variable DATABASE_URL nao definida}"
          : "${LAMBDA_SECURITY_GROUP_ID:?Variable LAMBDA_SECURITY_GROUP_ID nao definida}"
          : "${LAMBDA_SUBNET_IDS:?Variable LAMBDA_SUBNET_IDS nao definida}"
          : "${JWT_ISSUER:?JWT_ISSUER nao definida}"
          : "${JWT_EXPIRATION:?JWT_EXPIRATION nao definida}"
          : "${DB_USERNAME:?DB_USERNAME nao resolvido}"
          : "${DB_PASSWORD:?DB_PASSWORD nao resolvido}"
          : "${JWT_SECRET:?JWT_SECRET nao definido}"

          if [[ ! "$DATABASE_URL" =~ ^jdbc:postgresql://[^/:]+:[0-9]+/[^/?]+$ ]]; then
            echo "::error::DATABASE_URL deve usar jdbc:postgresql://host:porta/banco"
            exit 1
          fi

          if [[ ! "$LAMBDA_SECURITY_GROUP_ID" =~ ^sg-[0-9a-f]+$ ]]; then
            echo "::error::LAMBDA_SECURITY_GROUP_ID possui formato invalido."
            exit 1
          fi

          if [[ ! "$LAMBDA_SUBNET_IDS" =~ ^subnet-[0-9a-f]+(,subnet-[0-9a-f]+)+$ ]]; then
            echo "::error::LAMBDA_SUBNET_IDS deve conter pelo menos duas subnets."
            exit 1
          fi

          if [[ ! "$JWT_EXPIRATION" =~ ^[0-9]+$ ]]; then
            echo "::error::JWT_EXPIRATION deve conter apenas numeros."
            exit 1
          fi

          if (( ${#JWT_SECRET} < 32 )); then
            echo "::error::JWT_SECRET deve possuir pelo menos 32 caracteres."
            exit 1
          fi

          echo "Configuracao do deploy validada."
          echo "Database URL configurada."
          echo "Security Group: $LAMBDA_SECURITY_GROUP_ID"
          echo "Subnets: $LAMBDA_SUBNET_IDS"
          echo "JWT issuer: $JWT_ISSUER"
          echo "JWT expiration: $JWT_EXPIRATION"

      - name: Deploy Lambda
        if: inputs.action == 'deploy'
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          LAMBDA_SECURITY_GROUP_ID: ${{ vars.LAMBDA_SECURITY_GROUP_ID }}
          LAMBDA_SUBNET_IDS: ${{ vars.LAMBDA_SUBNET_IDS }}
          JWT_ISSUER: ${{ vars.JWT_ISSUER || 'oficina360-auth' }}
          JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION || '3600' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          : "${SAM_ARTIFACTS_BUCKET:?Bucket SAM nao preparado}"
          : "${SAM_ARTIFACTS_PREFIX:?Prefixo SAM nao preparado}"
          : "${DB_USERNAME:?DB_USERNAME nao resolvido}"
          : "${DB_PASSWORD:?DB_PASSWORD nao resolvido}"

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --s3-bucket "$SAM_ARTIFACTS_BUCKET" \
            --s3-prefix "$SAM_ARTIFACTS_PREFIX" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              DBURL="$DATABASE_URL" \
              DBUsername="$DB_USERNAME" \
              DBPassword="$DB_PASSWORD" \
              JWTSecret="$JWT_SECRET" \
              JWTIssuer="$JWT_ISSUER" \
              JWTExpiration="$JWT_EXPIRATION" \
              DatabaseAccessSecurityGroupId="$LAMBDA_SECURITY_GROUP_ID" \
              LambdaSubnetIds="$LAMBDA_SUBNET_IDS"

      - name: Obter URL da API
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail

          AUTH_API_URL="$(
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='AuthApiUrl'].OutputValue | [0]" \
              --output text
          )"

          if [[ -z "$AUTH_API_URL" || "$AUTH_API_URL" == "None" ]]; then
            echo "::error::Output AuthApiUrl nao encontrado."
            exit 1
          fi

          echo "AUTH_API_URL=$AUTH_API_URL" >> "$GITHUB_ENV"
          echo "API Gateway URL: $AUTH_API_URL"

      - name: Mostrar outputs
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table

      - name: Gerar resumo do deploy
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail
          {
            echo "STACK_NAME=$STACK_NAME"
            echo "AUTH_API_URL=$AUTH_API_URL"
            echo "AWS_REGION=$AWS_REGION"
            echo "SAM_ARTIFACTS_BUCKET=$SAM_ARTIFACTS_BUCKET"
            echo "SAM_ARTIFACTS_PREFIX=$SAM_ARTIFACTS_PREFIX"
          } | tee lambda-deploy-summary.txt

      - name: Publicar resumo do deploy
        if: inputs.action == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: lambda-deploy-summary
          path: lambda-deploy-summary.txt
          if-no-files-found: error
          retention-days: 1

      - name: Destroy Lambda stack
        if: inputs.action == 'destroy'
        run: |
          set -euo pipefail

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Stack $STACK_NAME removida."
          else
            echo "Stack $STACK_NAME nao existe."
          fi

      - name: Limpar artefatos SAM
        if: inputs.action == 'destroy'
        run: |
          set -euo pipefail

          if ! aws s3api head-bucket --bucket "$SAM_ARTIFACTS_BUCKET" >/dev/null 2>&1; then
            echo "Bucket SAM nao existe ou nao esta acessivel."
            exit 0
          fi

          aws s3 rm \
            "s3://${SAM_ARTIFACTS_BUCKET}/${SAM_ARTIFACTS_PREFIX}/" \
            --recursive || true

          echo "Prefixo SAM removido. O bucket foi preservado."

      - name: Gerar diagnostico
        if: failure() && (inputs.action == 'deploy' || inputs.action == 'destroy')
        run: |
          {
            echo '===== AWS IDENTITY ====='
            aws sts get-caller-identity || true

            echo
            echo '===== STACK ====='
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" || true

            echo
            echo '===== STACK EVENTS ====='
            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --max-items 30 || true

            echo
            echo '===== BUCKET SAM ====='
            echo "bucket=${SAM_ARTIFACTS_BUCKET:-nao-calculado}"
            echo "prefix=${SAM_ARTIFACTS_PREFIX:-nao-calculado}"
          } > lambda-diagnostics.txt 2>&1

      - name: Publicar diagnostico
        if: failure() && (inputs.action == 'deploy' || inputs.action == 'destroy')
        uses: actions/upload-artifact@v4
        with:
          name: lambda-diagnostics
          path: lambda-diagnostics.txt
          if-no-files-found: warn
          retention-days: 1
