AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Oficina360 Authentication Lambda

Parameters:
  LambdaExecutionRoleArn:
    Type: String
    Description: ARN da IAM Role existente utilizada pela Lambda
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/.+$"
    ConstraintDescription: Informe um ARN valido de IAM Role.

  DBURL:
    Type: String
    Description: URL JDBC completa do PostgreSQL
    AllowedPattern: "^jdbc:postgresql://[^/:]+:[0-9]+/[^/?]+$"
    ConstraintDescription: Use jdbc:postgresql://host:porta/banco.

  DBUsername:
    Type: String
    Description: Usuario do PostgreSQL
    NoEcho: true

  DBPassword:
    Type: String
    Description: Senha do PostgreSQL
    NoEcho: true

  JWTSecret:
    Type: String
    Description: Chave usada para assinar o JWT
    NoEcho: true
    MinLength: 32

  JWTIssuer:
    Type: String
    Description: Emissor do JWT
    Default: oficina360-auth

  JWTExpiration:
    Type: String
    Description: Expiracao do JWT em segundos
    Default: "3600"
    AllowedPattern: "^[0-9]+$"
    ConstraintDescription: JWTExpiration deve conter apenas numeros.

  DatabaseAccessSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group associado a Lambda para acesso ao PostgreSQL

  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets utilizadas pela Lambda

Globals:
  Function:
    Runtime: java21
    Timeout: 15
    MemorySize: 512

Resources:
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: oficina360-auth
      CodeUri: .
      Handler: com.techchallenger.oficina360.Handler::handleRequest
      Role: !Ref LambdaExecutionRoleArn

      VpcConfig:
        SecurityGroupIds:
          - !Ref DatabaseAccessSecurityGroupId
        SubnetIds: !Ref LambdaSubnetIds

      Environment:
        Variables:
          DB_URL: !Ref DBURL
          DB_USERNAME: !Ref DBUsername
          DB_PASSWORD: !Ref DBPassword
          secret: !Ref JWTSecret
          issuer: !Ref JWTIssuer
          expiration: !Ref JWTExpiration

      Events:
        AuthApi:
          Type: Api
          Properties:
            Path: /auth
            Method: POST

Outputs:
  AuthFunctionName:
    Description: Nome da funcao autenticadora
    Value: !Ref AuthFunction

  AuthFunctionArn:
    Description: ARN da funcao autenticadora
    Value: !GetAtt AuthFunction.Arn

  AuthApiUrl:
    Description: URL do endpoint de autenticacao
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/auth"
